[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "renpy-capture"
version = "0.2.1"
description = "Every line of a Ren'Py visual novel, in every branch, with a screenshot taken by the game's own engine"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aiken" }]
requires-python = ">=3.9"
dependencies = ["Pillow>=9"]
classifiers = [
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Localization",
]

[project.urls]
Homepage = "https://github.com/Aiken-Project-A/renpy-capture"
Issues = "https://github.com/Aiken-Project-A/renpy-capture/issues"

[project.scripts]
renpy-capture = "renpy_capture.cli:main"

[tool.setuptools]
packages = ["renpy_capture"]

[tool.setuptools.package-data]
renpy_capture = ["capture.rpy"]
