# A release on GitHub goes to PyPI by itself. No password or token is stored anywhere: PyPI trusts this workflow of
# this repository (trusted publishing, OpenID Connect), and the job gets a short-lived token for one upload.
# Run by hand with a tag to publish a release made before this file existed.
name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag to publish, e.g. v0.2.1"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build the package
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: The version in the package is the tag's
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          ls dist/ | grep -F -- "-${tag#v}" || { echo "the package version is not ${tag#v}"; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
