name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true             # 3.14 may still be a release candidate
      - run: pip install .
      - run: python -m unittest discover -s tests -t . -v

  end-to-end:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        renpy-version: ['8.5.3', '8.3.2', '7.8.7']   # 7.8.7 runs the in-engine script on Python 2.7
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Xvfb and Mesa
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libegl1
      - uses: actions/cache@v6
        with:
          path: ~/.cache/renpy-capture/sdk
          key: ${{ runner.os }}-renpy-sdk-${{ matrix.renpy-version }}
      - run: pip install .
      - name: Capture The Question under Xvfb
        env:
          RENPY_CAPTURE_IT: '1'
          RENPY_CAPTURE_IT_DISPLAY: xvfb
          RENPY_CAPTURE_IT_VERSION: ${{ matrix.renpy-version }}
          RENPY_CAPTURE_IT_KEEP: ${{ runner.temp }}/reference
        run: python -m unittest tests.test_the_question -v
      - name: Keep the capture, the reference of the Windows job
        uses: actions/upload-artifact@v7
        with:
          name: the-question-linux-${{ matrix.renpy-version }}
          path: ${{ runner.temp }}/reference
          retention-days: 7
      - name: Capture the Torture Test under Xvfb
        env:
          RENPY_CAPTURE_IT: '1'
          RENPY_CAPTURE_IT_DISPLAY: xvfb
          RENPY_CAPTURE_IT_VERSION: ${{ matrix.renpy-version }}
        run: python -m unittest tests.test_torture -v

  window:
    # The window on a real (virtual) screen: its tests, and The Question captured through it, with Cancel stopping the
    # engine. Tk must be there: a Python without it would skip the tests and pass.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Xvfb, Mesa and Tk
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libegl1 libtk8.6
      - uses: actions/cache@v6
        with:
          path: ~/.cache/renpy-capture/sdk
          key: ${{ runner.os }}-renpy-sdk-8.3.2
      - run: pip install .
      - name: Tk is there, and a window can be opened
        run: xvfb-run -a python -c "import tkinter; tkinter.Tk().destroy(); print('Tk', tkinter.TkVersion)"
      - name: The window, and The Question through it
        env:
          RENPY_CAPTURE_IT: '1'
          RENPY_CAPTURE_IT_VERSION: '8.3.2'
        run: xvfb-run -a -s "-screen 0 1280x1024x24" python -m unittest tests.test_gui_window -v

  windows-unit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install .
      - run: python -m unittest discover -s tests -t . -v

  windows-end-to-end:
    runs-on: windows-latest
    needs: end-to-end                        # its capture on Linux is the reference
    strategy:
      fail-fast: false
      matrix:
        renpy-version: ['8.3.2', '7.8.7']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/cache@v6
        with:
          path: ~\AppData\Local\renpy-capture\sdk
          key: ${{ runner.os }}-renpy-sdk-${{ matrix.renpy-version }}
      - run: pip install .
      - name: A screen of 1920x1080 (1024x768 shrinks the game window, and the frames with it)
        shell: pwsh
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - name: The capture of the same game on Linux
        uses: actions/download-artifact@v8
        with:
          name: the-question-linux-${{ matrix.renpy-version }}
          path: ${{ runner.temp }}/reference
      - name: Capture The Question, and compare it with Linux line by line
        env:
          RENPY_CAPTURE_IT: '1'
          RENPY_CAPTURE_IT_VERSION: ${{ matrix.renpy-version }}
          RENPY_CAPTURE_IT_REFERENCE: ${{ runner.temp }}/reference
        run: python -m unittest tests.test_the_question -v
      - name: Capture it with the command line, as a user would, and on each display of Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $sdk = renpy-capture sdk --renpy-version ${{ matrix.renpy-version }}
          $game, $work = "$env:RUNNER_TEMP\the_question", "$env:RUNNER_TEMP\work"
          Copy-Item -Recurse "$sdk\the_question" $game
          renpy-capture capture $game $work --renpy-version ${{ matrix.renpy-version }}
          renpy-capture compare "$env:RUNNER_TEMP\reference" "$work\out" --states-only
          foreach ($d in 'window', 'offscreen') {               # the same frames, to the byte, as the default
            renpy-capture run "$work\run" "$work\config.json" "$work\out-$d" --display $d
            renpy-capture compare "$work\out" "$work\out-$d"
          }
      - name: What the engine drew with
        if: always()
        shell: pwsh
        run: |
          Select-String -Path "$env:RUNNER_TEMP\work\run\log.txt" -Pattern 'Renderer:|Version:|Screen sizes|display bounds' -ErrorAction SilentlyContinue
          exit 0
      - name: Capture the Torture Test
        env:
          RENPY_CAPTURE_IT: '1'
          RENPY_CAPTURE_IT_VERSION: ${{ matrix.renpy-version }}
        run: python -m unittest tests.test_torture -v
      - name: Capture The Question through the window, compare it with Linux, and take the window's picture
        env:
          RENPY_CAPTURE_IT: '1'
          RENPY_CAPTURE_IT_VERSION: ${{ matrix.renpy-version }}
          RENPY_CAPTURE_IT_REFERENCE: ${{ runner.temp }}/reference
          RENPY_CAPTURE_GUI_SHOT: ${{ runner.temp }}/window.png
          RENPY_CAPTURE_GUI_SHOT_BASE: 'C:\'               # the picture shows C:\Games\… and C:\renpy-capture\…
        run: python -m unittest tests.test_gui_window -v
      - name: Keep the picture of the window
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: window-${{ matrix.renpy-version }}
          path: ${{ runner.temp }}/window.png
          if-no-files-found: ignore
          retention-days: 14

  tutorial:
    # The Ren'Py Tutorial, the larger game of the SDK, captured as a user would (tests/test_tutorial.py): a few
    # minutes under Xvfb, so on one Ren'Py version only.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Xvfb and Mesa
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libegl1
      - uses: actions/cache@v6
        with:
          path: ~/.cache/renpy-capture/sdk
          key: ${{ runner.os }}-renpy-sdk-8.5.3
      - run: pip install .
      - name: Capture the Tutorial under Xvfb
        env:
          RENPY_CAPTURE_IT_TUTORIAL: '1'
          RENPY_CAPTURE_IT_DISPLAY: xvfb
          RENPY_CAPTURE_IT_VERSION: '8.5.3'
        run: python -m unittest tests.test_tutorial -v
