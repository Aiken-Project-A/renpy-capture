# Temporary: measures the displays of Windows on the runner. Removed before the pull request is merged.
name: windows-probe

on:
  push:
    branches: [claude/windows-support-blmu2e]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        renpy-version: ['8.3.2', '7.8.7']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/cache@v6
        with:
          path: ~\AppData\Local\renpy-capture\sdk
          key: ${{ runner.os }}-renpy-sdk-${{ matrix.renpy-version }}
      - run: pip install .
      - name: The machine
        shell: pwsh
        run: |
          Get-CimInstance Win32_VideoController | Format-List Name,CurrentHorizontalResolution,CurrentVerticalResolution,DriverVersion
          Get-CimInstance Win32_OperatingSystem | Format-List Caption,Version
          python -c "import ctypes; s=ctypes.c_ulong(); ctypes.windll.kernel32.ProcessIdToSessionId(ctypes.windll.kernel32.GetCurrentProcessId(), ctypes.byref(s)); print('session id', s.value, 'screen', ctypes.windll.user32.GetSystemMetrics(0), ctypes.windll.user32.GetSystemMetrics(1), 'dpi', ctypes.windll.user32.GetDpiForSystem())"
      - name: The SDK
        shell: pwsh
        run: |
          $t = Measure-Command { renpy-capture sdk --renpy-version ${{ matrix.renpy-version }} | Out-Host }
          "sdk: $($t.TotalSeconds) s"
      - name: Each display
        shell: pwsh
        run: |
          $sdk = renpy-capture sdk --renpy-version ${{ matrix.renpy-version }}
          Copy-Item -Recurse "$sdk\the_question" "$env:RUNNER_TEMP\tq"
          foreach ($d in 'window', 'offscreen', 'desktop') {
            "===== $d"
            $w = "$env:RUNNER_TEMP\work-$d"
            $t = Measure-Command { renpy-capture capture "$env:RUNNER_TEMP\tq" $w --display $d --renpy-version ${{ matrix.renpy-version }} 2>&1 | Out-Host }
            "$d took $($t.TotalSeconds) s, exit $LASTEXITCODE"
            Select-String -Path "$w\run\log.txt" -Pattern 'enderer|Vendor|Version|Screen sizes|display bounds|Using|GL ' -ErrorAction SilentlyContinue | Select-Object -First 30
            Get-Content "$w\out\renpy.log" -ErrorAction SilentlyContinue | Select-Object -Last 20
            python .github/workflows/probe_frames.py "$w\out"
          }
          foreach ($d in 'offscreen', 'desktop') {
            "===== window vs $d, frames"
            renpy-capture compare "$env:RUNNER_TEMP\work-window\out" "$env:RUNNER_TEMP\work-$d\out"
            "===== window vs $d, states"
            renpy-capture compare "$env:RUNNER_TEMP\work-window\out" "$env:RUNNER_TEMP\work-$d\out" --states-only
          }
          "===== window twice"
          renpy-capture run "$env:RUNNER_TEMP\work-window\run" "$env:RUNNER_TEMP\work-window\config.json" "$env:RUNNER_TEMP\again" --display window
          renpy-capture compare "$env:RUNNER_TEMP\work-window\out" "$env:RUNNER_TEMP\again"
      - name: A larger screen
        shell: pwsh
        run: |
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force; "set" } catch { "Set-DisplayResolution: $_" }
          python -c "import ctypes; print('screen', ctypes.windll.user32.GetSystemMetrics(0), ctypes.windll.user32.GetSystemMetrics(1))"
          $sdk = renpy-capture sdk --renpy-version ${{ matrix.renpy-version }}
          Copy-Item -Recurse "$sdk\the_question" "$env:RUNNER_TEMP\tq2"
          renpy-capture capture "$env:RUNNER_TEMP\tq2" "$env:RUNNER_TEMP\big" --renpy-version ${{ matrix.renpy-version }}
          Select-String -Path "$env:RUNNER_TEMP\big\run\log.txt" -Pattern 'Screen sizes|display bounds' -ErrorAction SilentlyContinue
          python .github/workflows/probe_frames.py "$env:RUNNER_TEMP\big\out"
